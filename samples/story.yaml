# 시연용 샘플 에피소드 「퍼실 선생님의 PoC 교실」 — 30컷 콘티와 대본
# 가상의 학생 둘과 퍼실이 "내 업무 어디에 AI를 넣을까" 수업 내용을 이야기한다. 등장인물은 모두 가상이다.
# 대본(장면·대사)은 사람이나 언어 모델이 미리 쓰는 입력 파일이다. 이 샘플은 Claude Code 가 썼다.
# 이후 단계(그림 생성 → 얼굴 탐지 → 이름 붙이기 → 말풍선 배치 → 조립)는 전부 로컬에서 자동으로 돈다.
#
# cast  : 컷에 나오는 인물을 화면 왼쪽부터 순서대로. 탐지한 얼굴을 x 좌표 순으로 정렬해 이 이름을 붙인다.
# size  : tall(768x1024) / wide(1024x640) / square(768x768)
# scene : 그림 생성 프롬프트(영어). {이름} 은 characters 설명으로 바뀐다. 인물 위치를 cast 순서와 맞게 적는다.
# lines : 대사. type = speech | shout | thought | narration | sfx

characters:
  facil: "a friendly young male teacher with short wavy hair, round glasses and a navy cardigan with a lanyard"
  hana: "a cheerful female student with a short brown bob haircut and a yellow hoodie"
  jun: "a calm male student with messy black hair and a gray sweatshirt"
  corgi: "a chubby corgi wearing a small pink t-shirt"

style: "korean webtoon panel, clean anime line art, cel shading, bright classroom lighting"

panels:
  # ───────── 1. 도구가 아니라 병목에서 출발 ─────────
  - id: "01"
    size: wide
    cast: []
    scene: "a bright small classroom with a whiteboard and three desks with laptops, morning sunlight, no people"
    lines:
      - {type: narration, ko: "오늘의 수업: 내 업무 어디에 AI를 넣을까?"}
  - id: "02"
    size: tall
    cast: [hana]
    scene: "{hana} raising her hand eagerly at her desk"
    lines:
      - {who: hana, type: speech, ko: "제일 좋은 AI\n모델이 뭐예요?"}
  - id: "03"
    size: square
    cast: [facil]
    scene: "{facil} smiling and shaking his finger gently, upper body"
    lines:
      - {who: facil, type: speech, ko: "도구부터 고르면\n아무도 안 써요"}
  - id: "04"
    size: wide
    cast: [facil]
    # 처음엔 BOTTLENECK 글자를 쓰게 했는데 두 번 다 철자가 틀려서(samples/rejected/) 그림으로 바꿈
    scene: "{facil} drawing a simple bottle shape with a narrow neck and arrows on a whiteboard, no letters"
    lines:
      - {who: facil, type: speech, ko: "먼저 내 일에서\n병목을 찾는 거예요"}
  - id: "05"
    size: tall
    cast: [jun]
    scene: "{jun} taking notes in a notebook, thoughtful"
    lines:
      - {who: jun, type: thought, ko: "PoC는 쓰이는 게 아니라\n판단이 서는 게 목적…"}
  # ───────── 2. 업무 4유형 ─────────
  - id: "06"
    size: wide
    cast: []
    scene: "a whiteboard divided into four boxes with simple icons: magnifying glass, eye, sorting arrows, pen, no people"
    lines:
      - {type: narration, ko: "검색 · 검사와 판독 · 분류와 배분 · 입력과 전사"}
  - id: "07"
    size: wide
    cast: [hana, jun]
    scene: "{hana} on the left counting on her fingers, {jun} on the right pointing at the whiteboard"
    lines:
      - {who: hana, type: speech, ko: "사진 수만 장에서\n찾는 건 검사?"}
      - {who: jun, type: speech, ko: "아니, 찾는 거니까\n검색!"}
  - id: "08"
    size: square
    cast: [facil]
    scene: "{facil} giving a thumbs up with a wink"
    lines:
      - {who: facil, type: speech, ko: "정답!\n등급을 매기면 검사예요"}
  # ───────── 3. 성공 기준은 먼저, 숫자로 ─────────
  - id: "09"
    size: tall
    cast: [facil]
    scene: "{facil} holding up a sheet of paper with a big number 18/20 written on it"
    lines:
      - {who: facil, type: speech, ko: "만들기 전에\n기준을 숫자로!"}
  - id: "10"
    size: square
    cast: [hana]
    scene: "{hana} tilting her head, confused"
    lines:
      - {who: hana, type: speech, ko: "결과 보고\n정하면 안 돼요?"}
  - id: "11"
    size: wide
    cast: [facil, hana]
    scene: "{facil} on the left explaining with open hands, {hana} on the right listening"
    lines:
      - {who: facil, type: speech, ko: "그러면 기준이\n결과 쪽으로 기울어요"}
      - {who: hana, type: thought, ko: "17개면 괜찮네…\n하게 되는구나"}
  # ───────── 4. 성격이 다른 후보 + 기준선 ─────────
  - id: "12"
    size: wide
    cast: []
    scene: "three cards on a table: a laptop icon, a cloud icon, and a human eye icon, no people"
    lines:
      - {type: narration, ko: "후보는 크기 말고 성격이 다르게"}
      - {type: narration, ko: "내 노트북 · 외부 서비스 · 지금 방식"}
  - id: "13"
    size: tall
    cast: [jun]
    scene: "{jun} raising his hand with a puzzled look"
    lines:
      - {who: jun, type: speech, ko: "지금 방식도\n후보예요?"}
  - id: "14"
    size: square
    cast: [facil]
    scene: "{facil} nodding seriously with arms crossed"
    lines:
      - {who: facil, type: speech, ko: "기준선이 이기면\n그것도 결과예요"}
  # ───────── 5. 걸러내기가 먼저 ─────────
  - id: "15"
    size: wide
    cast: []
    scene: "a funnel drawing on a whiteboard filtering out a cloud icon and a padlock icon, no people"
    lines:
      - {type: narration, ko: "점수보다 먼저: 자료 유출, 라이선스"}
  - id: "16"
    size: wide
    cast: [hana, facil]
    scene: "{hana} on the left surprised, {facil} on the right holding a document with a red stamp"
    lines:
      - {who: hana, type: speech, ko: "정확도 1등인데\n탈락이에요?"}
      - {who: facil, type: speech, ko: "감점으로 하면\n못 쓰는 게 1등 해요"}
  - id: "17"
    size: square
    cast: [jun]
    scene: "close-up of {jun} reading a license text on his laptop, squinting"
    lines:
      - {who: jun, type: thought, ko: "AGPL…\n회사에선 조심"}
  # ───────── 6. softmax 와 sigmoid ─────────
  - id: "18"
    size: tall
    cast: [facil]
    scene: "{facil} pointing at a whiteboard with a ranking podium drawing"
    lines:
      - {who: facil, type: speech, ko: "softmax는 등수.\n없어도 1등이 나와요"}
  - id: "19"
    size: square
    cast: [hana]
    scene: "{hana} with a light bulb moment, eyes sparkling"
    lines:
      - {who: hana, type: speech, ko: "sigmoid는\n절대평가!"}
  # ───────── 7. 신뢰도 ─────────
  - id: "20"
    size: square
    cast: [corgi]
    scene: "a cartoon corgi doing a squat exercise, side view, comedic"
    lines:
      - {type: sfx, ko: "영차"}
  - id: "21"
    size: wide
    cast: [jun]
    scene: "{jun} looking at a laptop screen showing a stick figure skeleton with some red joints, confused"
    lines:
      - {who: jun, type: speech, ko: "다리가 화면에 없는데\n각도가 20도래요"}
  - id: "22"
    size: tall
    cast: [facil]
    scene: "{facil} raising one finger with a knowing smile"
    lines:
      - {who: facil, type: speech, ko: "신뢰도를 안 봤죠?\n오류 없이 틀리는 곳이에요"}
  # ───────── 8. 임계값: 어느 실수가 더 아픈가 ─────────
  - id: "23"
    size: wide
    cast: []
    scene: "a seesaw drawing on a whiteboard balancing two words FALSE ALARM and MISS, no people"
    lines:
      - {type: narration, ko: "임계값을 올리면 헛경보↓ 놓침↑"}
  - id: "24"
    size: wide
    cast: [hana, jun]
    scene: "{hana} on the left arguing passionately, {jun} on the right nodding"
    lines:
      - {who: hana, type: speech, ko: "놓치면 발행되니까\n낮게!"}
      - {who: jun, type: speech, ko: "너무 낮으면\n다 울려서 무시하고"}
  - id: "25"
    size: square
    cast: [facil]
    scene: "{facil} clapping happily"
    lines:
      - {type: sfx, ko: "짝짝짝"}
      - {who: facil, type: speech, ko: "정답은 없어요.\n더 아픈 쪽을 막아요"}
  # ───────── 9. 대체가 아니라 교차 검증 ─────────
  - id: "26"
    size: tall
    cast: [hana]
    scene: "{hana} looking at her laptop with a slightly disappointed face"
    lines:
      - {who: hana, type: speech, ko: "모델이 95%…\n지금 방식이 더 잘해요"}
  - id: "27"
    size: wide
    cast: [facil, hana]
    scene: "{facil} on the left drawing two overlapping circles on the whiteboard, {hana} on the right watching"
    lines:
      - {who: facil, type: speech, ko: "틀리는 방식이 다르면\n서로 검산할 수 있어요"}
      - {who: hana, type: thought, ko: "다른 컷만\n보면 되겠다!"}
  - id: "28"
    size: square
    cast: []
    scene: "a laptop screen showing a list of comic panels with a few highlighted in yellow, no people"
    lines:
      - {type: narration, ko: "63컷 중 8컷만 확인"}
  # ───────── 마무리 ─────────
  - id: "29"
    size: wide
    cast: [hana, facil, jun]
    scene: "{hana} on the left, {facil} in the middle, {jun} on the right, all smiling and giving thumbs up"
    lines:
      - {who: facil, type: speech, ko: "잘된다 ≠\n잘된다는 걸 확인했다"}
  - id: "30"
    size: wide
    cast: []
    scene: "the empty classroom at sunset with notes left on the whiteboard, warm light, no people"
    lines:
      - {type: narration, ko: "— 오늘의 회고: 기준을 넘지 못한 이유도 결과다 —"}
