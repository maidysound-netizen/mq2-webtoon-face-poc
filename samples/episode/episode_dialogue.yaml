panels:
  '01':
  - who: narration
    type: narration
    side: center
    ko: '오늘의 수업: 내 업무 어디에 AI를 넣을까?'
  '02':
  - who: hana
    type: speech
    side: center
    ko: '제일 좋은 AI

      모델이 뭐예요?'
  '03':
  - who: facil
    type: speech
    side: center
    ko: '도구부터 고르면

      아무도 안 써요'
  '04':
  - who: facil
    type: speech
    side: center
    ko: '먼저 내 일에서

      병목을 찾는 거예요'
  '05':
  - who: jun
    type: thought
    side: center
    ko: 'PoC는 쓰이는 게 아니라

      판단이 서는 게 목적…'
  '06':
  - who: narration
    type: narration
    side: center
    ko: 검색 · 검사와 판독 · 분류와 배분 · 입력과 전사
  '07':
  - who: hana
    type: speech
    side: left
    ko: '사진 수만 장에서

      찾는 건 검사?'
  - who: jun
    type: speech
    side: right
    ko: '아니, 찾는 거니까

      검색!'
  08:
  - who: facil
    type: speech
    side: center
    ko: '정답!

      등급을 매기면 검사예요'
  09:
  - who: facil
    type: speech
    side: center
    ko: '만들기 전에

      기준을 숫자로!'
  '10':
  - who: hana
    type: speech
    side: center
    ko: '결과 보고

      정하면 안 돼요?'
  '11':
  - who: facil
    type: speech
    side: left
    ko: '그러면 기준이

      결과 쪽으로 기울어요'
  - who: hana
    type: thought
    side: right
    ko: '17개면 괜찮네…

      하게 되는구나'
  '12':
  - who: narration
    type: narration
    side: center
    ko: 후보는 크기 말고 성격이 다르게
  - who: narration
    type: narration
    side: center
    ko: 내 노트북 · 외부 서비스 · 지금 방식
  '13':
  - who: jun
    type: speech
    side: center
    ko: '지금 방식도

      후보예요?'
  '14':
  - who: facil
    type: speech
    side: center
    ko: '기준선이 이기면

      그것도 결과예요'
  '15':
  - who: narration
    type: narration
    side: center
    ko: '점수보다 먼저: 자료 유출, 라이선스'
  '16':
  - who: hana
    type: speech
    side: left
    ko: '정확도 1등인데

      탈락이에요?'
  - who: facil
    type: speech
    side: right
    ko: '감점으로 하면

      못 쓰는 게 1등 해요'
  '17':
  - who: jun
    type: thought
    side: center
    ko: 'AGPL…

      회사에선 조심'
  '18':
  - who: facil
    type: speech
    side: center
    ko: 'softmax는 등수.

      없어도 1등이 나와요'
  '19':
  - who: hana
    type: speech
    side: center
    ko: 'sigmoid는

      절대평가!'
  '20':
  - who: sfx
    type: sfx
    side: center
    ko: 영차
  '21':
  - who: jun
    type: speech
    side: center
    ko: '다리가 화면에 없는데

      각도가 20도래요'
  '22':
  - who: facil
    type: speech
    side: center
    ko: '신뢰도를 안 봤죠?

      오류 없이 틀리는 곳이에요'
  '23':
  - who: narration
    type: narration
    side: center
    ko: 임계값을 올리면 헛경보↓ 놓침↑
  '24':
  - who: hana
    type: speech
    side: left
    ko: '놓치면 발행되니까

      낮게!'
  - who: jun
    type: speech
    side: right
    ko: '너무 낮으면

      다 울려서 무시하고'
  '25':
  - who: sfx
    type: sfx
    side: center
    ko: 짝짝짝
  - who: facil
    type: speech
    side: center
    ko: '정답은 없어요.

      더 아픈 쪽을 막아요'
  '26':
  - who: hana
    type: speech
    side: center
    ko: '모델이 95%…

      지금 방식이 더 잘해요'
  '27':
  - who: facil
    type: speech
    side: left
    ko: '틀리는 방식이 다르면

      서로 검산할 수 있어요'
  - who: hana
    type: thought
    side: right
    ko: '다른 컷만

      보면 되겠다!'
  '28':
  - who: narration
    type: narration
    side: center
    ko: 63컷 중 8컷만 확인
  '29':
  - who: facil
    type: speech
    side: center
    ko: '잘된다 ≠

      잘된다는 걸 확인했다'
  '30':
  - who: narration
    type: narration
    side: center
    ko: '— 오늘의 회고: 기준을 넘지 못한 이유도 결과다 —'
